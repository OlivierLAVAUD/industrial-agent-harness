[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-agent-harness"
version = "0.1.0"
description = "PoC de supervision humaine et de traçabilité vérifiable pour un agent GenAI de maintenance industrielle"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Industrial Agent Harness" }]
keywords = ["graphrag", "neo4j", "langgraph", "preloop", "mcp", "ai-act", "human-in-the-loop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "neo4j>=5.20,<7",
    "langgraph>=0.6,<2",
    "langchain>=0.3,<2",
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.2,<2",
    "langchain-mcp-adapters>=0.1,<0.4",
    "langchain-preloop>=0.1,<0.2",
    "mcp>=1.10,<2",
    "streamlit>=1.37,<2",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "typing-extensions>=4.8",
]

[project.optional-dependencies]
# The `preloop` PyPI distribution is the self-hosted control-plane server, not
# an SDK. It is kept optional so the demo image stays lightweight. The real
# tool-boundary integration is provided by `langchain-preloop` above; without a
# running Preloop server the harness uses its explicitly documented local
# fallback (HMAC audit ledger + in-memory approval store).
preloop-server = ["preloop>=0.17.1,<0.18"]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.6,<1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["graph*", "agent*", "harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a running and seeded Neo4j instance",
    "neo4j: requires a running Neo4j instance",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
